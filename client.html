<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Transcription - Real Time</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }
        
        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            flex: 1;
            min-width: 120px;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        #startBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        #stopBtn {
            background: #ff6b6b;
            color: white;
        }
        
        #stopBtn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        #clearBtn {
            background: #495057;
            color: white;
        }
        
        .status {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }
        
        .status.recording {
            border-left-color: #ff6b6b;
            background: #ffe0e0;
        }
        
        .status.connected {
            border-left-color: #51cf66;
            background: #e7f5e7;
        }
        
        .status.error {
            border-left-color: #ff6b6b;
            background: #ffe0e0;
        }
        
        .status-text {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        
        .status-detail {
            color: #666;
            font-size: 12px;
        }
        
        .output-section {
            margin-top: 30px;
        }

        .text-input-section {
            margin-top: 20px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        #textInput {
            flex: 1;
            min-width: 220px;
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 8px;
            font-size: 14px;
        }

        #sendTextBtn {
            background: #0b7285;
            color: white;
            min-width: 140px;
        }
        
        .output-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        #transcription {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            min-height: 100px;
            line-height: 1.6;
            color: #333;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        
        #transcription.empty {
            color: #999;
        }
        
        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
            font-size: 12px;
        }
        
        .stat-item {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }
        
        .stat-label {
            color: #666;
            font-weight: 600;
        }
        
        .stat-value {
            color: #333;
            font-size: 18px;
            font-weight: 700;
            margin-top: 5px;
        }
        
        .recording-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #ff6b6b;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Voice Transcription</h1>
        <p class="subtitle">Entrevista clinica por HTTPS (audio por archivo)</p>
        
        <div class="controls">
            <button id="startBtn">Start Recording</button>
            <button id="stopBtn" disabled>Stop Recording</button>
            <button id="sendAudioBtn" disabled>Enviar Audio</button>
            <button id="finalizeBtn" disabled>Finalizar Sesion</button>
            <button id="clearBtn">Clear</button>
        </div>

        <div class="text-input-section">
            <input id="patientName" type="text" placeholder="Descripcion breve de la condicion" />
            <input id="patientAge" type="text" placeholder="Sintomas principales" style="max-width:220px;" />
            <input id="chiefComplaint" type="text" placeholder="Detalles utiles opcionales" />
        </div>

        <div class="status" id="status">
            <div class="status-text">Disconnected</div>
            <div class="status-detail">Click "Start Recording" to begin</div>
        </div>
        
        <div class="output-section">
            <div class="output-title">Recomendacion IA:</div>
            <div id="lastTranscript" class="empty">Aun no hay recomendacion</div>
            <br />
            <div class="output-title">Transcripcion local:</div>
            <div id="transcription" class="empty">Waiting for audio input...</div>
            <div id="finalRecord" style="margin-top: 12px; font-size: 12px; color: #444;"></div>
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">Audios Enviados</div>
                <div class="stat-value" id="chunkCount">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">Characters</div>
                <div class="stat-value" id="charCount">0</div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:8000/speech';

        let stream = null;
        let audioContext = null;
        let sourceNode = null;
        let processorNode = null;
        let muteNode = null;
        let recordedChunks = [];
        let recordedSamples = 0;
        let chunkCount = 0;
        let fullText = '';
        let pendingStop = false;
        let currentSampleRate = 16000;
        let sessionId = '';
        let startedSession = false;

        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const sendAudioBtn = document.getElementById('sendAudioBtn');
        const finalizeBtn = document.getElementById('finalizeBtn');
        const clearBtn = document.getElementById('clearBtn');
        const patientName = document.getElementById('patientName');
        const patientAge = document.getElementById('patientAge');
        const chiefComplaint = document.getElementById('chiefComplaint');
        const lastTranscriptDiv = document.getElementById('lastTranscript');
        const transcriptionDiv = document.getElementById('transcription');
        const finalRecordDiv = document.getElementById('finalRecord');
        const statusDiv = document.getElementById('status');
        const chunkCountEl = document.getElementById('chunkCount');
        const charCountEl = document.getElementById('charCount');

        function updateStatus(message, type = 'info') {
            const statusMap = {
                'info': { class: 'connected' },
                'recording': { class: 'recording' },
                'error': { class: 'error' },
                'connected': { class: 'connected' }
            };
            
            const config = statusMap[type] || statusMap['info'];
            statusDiv.className = `status ${config.class}`;
            statusDiv.innerHTML = `
                <div class="status-text">${message}</div>
                <div class="status-detail">${new Date().toLocaleTimeString()}</div>
            `;
            
        }

        function updateTranscription(text) {
            if (text && text.trim()) {
                fullText += text + ' ';
                transcriptionDiv.textContent = fullText.trim();
                transcriptionDiv.classList.remove('empty');
                charCountEl.textContent = fullText.trim().length;
                
            }
        }

        function appendConversationTurn(role, text) {
            if (!text || !text.trim()) {
                return;
            }

            if (transcriptionDiv.classList.contains('empty')) {
                transcriptionDiv.classList.remove('empty');
                transcriptionDiv.textContent = '';
            }

            const prefix = role === 'assistant' ? 'IA' : 'Paciente';
            const current = transcriptionDiv.textContent.trim();
            const line = `${prefix}: ${text.trim()}`;
            transcriptionDiv.textContent = current ? `${current}\n${line}` : line;
            charCountEl.textContent = transcriptionDiv.textContent.length;
        }

        function createNewSessionId() {
            if (window.crypto && window.crypto.randomUUID) {
                sessionId = window.crypto.randomUUID();
            } else {
                sessionId = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
            }
            return sessionId;
        }

        function clearTranscription() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            fullText = '';
            chunkCount = 0;
            recordedChunks = [];
            recordedSamples = 0;
            sessionId = '';
            startedSession = false;
            transcriptionDiv.textContent = 'Waiting for audio input...';
            transcriptionDiv.classList.add('empty');
            lastTranscriptDiv.textContent = 'Aun no hay recomendacion';
            lastTranscriptDiv.classList.add('empty');
            finalRecordDiv.textContent = '';
            chunkCountEl.textContent = '0';
            charCountEl.textContent = '0';
            sendAudioBtn.disabled = true;
            finalizeBtn.disabled = true;
            updateStatus('Cleared', 'info');
        }

        function floatToInt16(floatSamples) {
            const int16 = new Int16Array(floatSamples.length);
            for (let i = 0; i < floatSamples.length; i++) {
                const sample = Math.max(-1, Math.min(1, floatSamples[i]));
                int16[i] = sample < 0 ? sample * 32768 : sample * 32767;
            }
            return int16;
        }

        function mergeFloatChunks(chunks, totalLength) {
            const merged = new Float32Array(totalLength);
            let offset = 0;
            for (const chunk of chunks) {
                merged.set(chunk, offset);
                offset += chunk.length;
            }
            return merged;
        }

        function buildWavBlob(floatSamples, sampleRate) {
            const int16 = floatToInt16(floatSamples);
            const dataSize = int16.length * 2;
            const buffer = new ArrayBuffer(44 + dataSize);
            const view = new DataView(buffer);

            const writeString = (offset, value) => {
                for (let i = 0; i < value.length; i++) {
                    view.setUint8(offset + i, value.charCodeAt(i));
                }
            };

            writeString(0, 'RIFF');
            view.setUint32(4, 36 + dataSize, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, 1, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeString(36, 'data');
            view.setUint32(40, dataSize, true);

            let offset = 44;
            for (let i = 0; i < int16.length; i++, offset += 2) {
                view.setInt16(offset, int16[i], true);
            }

            return new Blob([buffer], { type: 'audio/wav' });
        }

        function buildFullRecordingBlob() {
            if (recordedSamples === 0) {
                return null;
            }
            const merged = mergeFloatChunks(recordedChunks, recordedSamples);
            return buildWavBlob(merged, currentSampleRate);
        }

        async function ensureClinicalSession() {
            if (startedSession && sessionId) {
                return;
            }

            const response = await fetch(`${API_BASE_URL}/clinical/start`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ session_id: sessionId || null })
            });

            if (!response.ok) {
                throw new Error(`No se pudo iniciar sesion clinica (${response.status})`);
            }

            const data = await response.json();
            sessionId = data.session_id;
            startedSession = true;
            if (data.assistant_reply) {
                appendConversationTurn('assistant', data.assistant_reply);
            }
            updateStatus(`Sesion iniciada: ${sessionId}`, 'connected');
            finalizeBtn.disabled = false;
        }

        async function sendFullAudioRecording() {
            const blob = buildFullRecordingBlob();
            if (!blob || blob.size === 0) {
                updateStatus('No hay audio para enviar', 'info');
                return;
            }

            await ensureClinicalSession();

            const formData = new FormData();
            formData.append('session_id', sessionId);
            formData.append('file', blob, 'recording.wav');

            updateStatus('Enviando audio...', 'info');
            const response = await fetch(`${API_BASE_URL}/clinical/audio`, {
                method: 'POST',
                body: formData,
            });

            if (!response.ok) {
                const detail = await response.text();
                throw new Error(`Error enviando audio (${response.status}): ${detail}`);
            }

            const data = await response.json();
            if (data.transcript) {
                lastTranscriptDiv.textContent = data.transcript;
                lastTranscriptDiv.classList.remove('empty');
                appendConversationTurn('user', data.transcript);
            }
            if (data.assistant_reply) {
                lastTranscriptDiv.textContent = data.assistant_reply;
                lastTranscriptDiv.classList.remove('empty');
            }
            finalRecordDiv.textContent = data.assistant_reply || '';

            chunkCount++;
            chunkCountEl.textContent = chunkCount;
            recordedChunks = [];
            recordedSamples = 0;
            sendAudioBtn.disabled = true;

            if (data.persistence === 'buffered') {
                updateStatus('Audio procesado (Mongo no disponible, modo buffer)', 'connected');
            } else {
                updateStatus('Audio procesado correctamente', 'connected');
            }
        }

        function setupAudioPipeline() {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) {
                throw new Error('Web Audio API not supported in this browser');
            }

            audioContext = new AudioCtx();
            currentSampleRate = audioContext.sampleRate;

            sourceNode = audioContext.createMediaStreamSource(stream);
            processorNode = audioContext.createScriptProcessor(4096, 1, 1);
            muteNode = audioContext.createGain();
            muteNode.gain.value = 0;

            processorNode.onaudioprocess = (event) => {
                const input = event.inputBuffer.getChannelData(0);
                const copy = new Float32Array(input);

                recordedChunks.push(copy);
                recordedSamples += copy.length;
            };

            sourceNode.connect(processorNode);
            processorNode.connect(muteNode);
            muteNode.connect(audioContext.destination);
        }

        async function teardownAudioPipeline() {
            try {
                if (processorNode) {
                    processorNode.disconnect();
                    processorNode.onaudioprocess = null;
                }

                if (sourceNode) {
                    sourceNode.disconnect();
                }

                if (muteNode) {
                    muteNode.disconnect();
                }

                if (audioContext && audioContext.state !== 'closed') {
                    await audioContext.close();
                }
            } finally {
                processorNode = null;
                sourceNode = null;
                muteNode = null;
                audioContext = null;
            }
        }

        async function startRecording() {
            try {
                await ensureClinicalSession();
                updateStatus('Requesting microphone permission...', 'info');
                
                // Request microphone access
                stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        echoCancellation: true,
                        noiseSuppression: true
                    } 
                });
                
                updateStatus('Microphone access granted', 'info');
                
                updateStatus('Sesion activa - Grabando...', 'recording');
                recordedChunks = [];
                recordedSamples = 0;
                sendAudioBtn.disabled = true;
                setupAudioPipeline();
                

                startBtn.disabled = true;
                stopBtn.disabled = false;
                sendAudioBtn.disabled = true;
                finalizeBtn.disabled = false;

            } catch (error) {
                updateStatus(`Error: ${error.message}`, 'error');
                console.error('Error:', error);
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
            }
        }

        async function stopRecording() {
            if (pendingStop) {
                return;
            }

            pendingStop = true;
            await teardownAudioPipeline();

            if (stream) {
                stream.getTracks().forEach(track => track.stop());
            }

            pendingStop = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            sendAudioBtn.disabled = recordedSamples === 0;
            finalizeBtn.disabled = false;
            updateStatus('Grabacion detenida. Ahora puedes enviar el audio completo.', 'info');
        }

        async function finalizeSession() {
            if (!startedSession || !sessionId) {
                updateStatus('No hay sesion activa para finalizar', 'info');
                return;
            }

            const response = await fetch(`${API_BASE_URL}/clinical/finalize/${sessionId}`, {
                method: 'POST',
            });

            if (!response.ok) {
                const detail = await response.text();
                throw new Error(`Error finalizando sesion (${response.status}): ${detail}`);
            }

            const data = await response.json();
            finalRecordDiv.textContent = data.final_clinical_history?.summary || data.final_clinical_history?.clinical_history?.possible_justification || '';
            if (data.persistence === 'persisted') {
                updateStatus('Sesion completada y guardada', 'connected');
            } else {
                updateStatus('Sesion completada en buffer local', 'connected');
            }

            sessionId = '';
            startedSession = false;
            finalizeBtn.disabled = true;
        }

        startBtn.addEventListener('click', startRecording);
        stopBtn.addEventListener('click', stopRecording);
        sendAudioBtn.addEventListener('click', () => {
            sendFullAudioRecording().catch((err) => {
                updateStatus(`Error enviando audio: ${err.message}`, 'error');
            });
        });
        finalizeBtn.addEventListener('click', () => {
            finalizeSession().catch((err) => {
                updateStatus(`Error finalizando sesion: ${err.message}`, 'error');
            });
        });
        clearBtn.addEventListener('click', clearTranscription);

        // Check Web Audio API support
        if (!(window.AudioContext || window.webkitAudioContext)) {
            updateStatus('Web Audio API not supported in this browser', 'error');
            startBtn.disabled = true;
        }
    </script>
</body>
</html>
