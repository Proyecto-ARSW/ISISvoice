name: Build and Deploy to Azure

on:
  push:
    branches: [develop, heuristicas, production]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: isisvoiceacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/app/Dockerfile
          push: true
          tags: isisvoiceacr.azurecr.io/isisvoice-api:latest
