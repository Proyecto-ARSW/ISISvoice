version: '3.9'

# ============================================================
# ISISvoice — GPU server (Ollama + Whisper)
# ============================================================
# Deploy this on the machine with GPU/resources for AI inference.
# The FastAPI core connects to these services via env vars:
#   OLLAMA_BASE_URL=http://<this-server-ip>:11434
#   WHISPER_API_URL=http://<this-server-ip>:8001
#
# Usage:
#   docker-compose -f docker-compose.gpu-server.yml up -d
#
# After first start, load the clinical model:
#   docker exec isisvoice-ollama ollama pull llama3.1
#   docker exec isisvoice-ollama ollama create clinical-intake -f /Modelfile.clinical-intake

services:

  ollama:
    image: ollama/ollama:latest
    container_name: isisvoice-ollama
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0
    volumes:
      - ollama_data:/root/.ollama
      - ./Modelfile.clinical-intake:/Modelfile.clinical-intake:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Uncomment for NVIDIA GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  whisper:
    build:
      context: .
      dockerfile: src/Dockerfile.whisper
    container_name: isisvoice-whisper
    ports:
      - "8001:8001"
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_LANGUAGE: ${WHISPER_LANGUAGE:-es}
    volumes:
      - whisper_cache:/root/.cache/whisper
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  ollama_data:
    driver: local
  whisper_cache:
    driver: local
